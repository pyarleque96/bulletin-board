<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Bulletin Board symbol">
  <title>Bulletin Board – Symbol Only (Light)</title>
  <rect width="512" height="512" fill="#FFFFFF"/>
  <!-- Bulletin board (rounded card) -->
  <rect x="80" y="120" width="352" height="272" rx="32" ry="32" fill="#101A3D"/>
  <!-- Pin / dot (orange) -->
  <circle cx="160" cy="184" r="22" fill="#F39323"/>
  <!-- Listing lines -->
  <rect x="200" y="172" width="180" height="24" rx="12" fill="#FFFFFF" opacity="0.95"/>
  <rect x="120" y="240" width="272" height="20" rx="10" fill="#FFFFFF" opacity="0.55"/>
  <rect x="120" y="280" width="220" height="20" rx="10" fill="#FFFFFF" opacity="0.55"/>
  <rect x="120" y="320" width="160" height="20" rx="10" fill="#F39323"/>
</svg>
