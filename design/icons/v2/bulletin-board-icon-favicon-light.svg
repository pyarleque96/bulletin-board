<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Bulletin Board">
  <title>Bulletin Board – Favicon (Light, optimized for 16px)</title>
  <rect width="32" height="32" rx="6" fill="#101A3D"/>
  <!-- Heavy "B" optimized for tiny rendering. The brand still resolves visually as "B + orange dot" at 16px. -->
  <g font-family="'Nunito','Poppins',system-ui,sans-serif" font-weight="900">
    <text x="6" y="25" font-size="26" fill="#FFFFFF">B</text>
  </g>
  <circle cx="24" cy="9" r="3.5" fill="#F39323"/>
</svg>
