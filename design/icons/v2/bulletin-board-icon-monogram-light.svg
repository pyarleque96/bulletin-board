<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Bulletin Board">
  <title>Bulletin Board – Monogram BB (Light)</title>
  <rect width="512" height="512" fill="#FFFFFF"/>
  <!-- Two B's side-by-side. Positive (not negative) letter-spacing + a thin navy hairline divider between them prevents the "single B" read. -->
  <g font-family="'Nunito','Poppins','Mulish',system-ui,sans-serif" font-weight="900" letter-spacing="-8">
    <text x="48" y="370" font-size="340" fill="#101A3D">B</text>
    <text x="272" y="370" font-size="340" fill="#F39323">B</text>
  </g>
  <!-- Hairline divider — disambiguates the two B's without breaking the wordmark feel -->
  <rect x="260" y="160" width="4" height="200" rx="2" fill="#101A3D" opacity="0.18"/>
  <!-- Pin dot anchored over the divider, echoing the "i" dot from the original wordmark -->
  <circle cx="262" cy="130" r="14" fill="#F39323"/>
</svg>
