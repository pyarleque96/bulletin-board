<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Bulletin Dells pin">
  <title>Bulletin Dells – Pin Glyph (Light, tab bar / nav)</title>
  <!-- Bulletin board card -->
  <rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="#101A3D" stroke-width="1.75"/>
  <!-- Pin dot -->
  <circle cx="7" cy="9" r="1.5" fill="#F39323"/>
  <!-- Listing lines -->
  <line x1="10.5" y1="9" x2="18" y2="9" stroke="#101A3D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6" y1="13" x2="18" y2="13" stroke="#101A3D" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="6" y1="16" x2="14" y2="16" stroke="#101A3D" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>
