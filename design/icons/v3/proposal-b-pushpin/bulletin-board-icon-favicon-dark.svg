<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Bulletin Board">
  <title>Bulletin Board – Pushpin Favicon (Dark, light surface)</title>
  <rect width="32" height="32" rx="6" ry="6" fill="#FDF5EB"/>
  <!-- Tiny note + tiny pin -->
  <rect x="6" y="7" width="20" height="22" rx="2" fill="#101A3D"/>
  <path d="M 26 22 L 22 29 L 22 22 Z" fill="#FCEFD4"/>
  <!-- BB tiny on note -->
  <text x="16" y="22" text-anchor="middle"
        font-family="'DM Sans',system-ui,sans-serif"
        font-size="11" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">B</text>
  <text x="22" y="22" text-anchor="middle"
        font-family="'DM Sans',system-ui,sans-serif"
        font-size="11" font-weight="900" fill="#F39323" letter-spacing="-1.5">B</text>
  <!-- Pin head -->
  <circle cx="16" cy="6" r="3.2" fill="#F39323"/>
  <circle cx="14.5" cy="5" r="1.2" fill="#FFFFFF" opacity="0.6"/>
</svg>
