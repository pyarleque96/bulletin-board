<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Bulletin Board">
  <title>Bulletin Board – Stencil App Icon (Light ink on dark surface)</title>
  <!-- The white B is rendered as solid white (the "knockout" effect is conceptual on a dark bg: white ink ON the dark surface).
       Right B is solid orange. Sharp edges differentiate from Booking's rounded fills. -->
  <rect width="512" height="512" rx="20" ry="20" fill="#0F172A"/>
  <!-- Left B in white -->
  <rect x="242" y="86" width="28" height="340" fill="#FFFFFF"/>
  <path fill="#FFFFFF" fill-rule="evenodd" d="M 242 86 L 156 86 C 100 86, 70 116, 70 166 C 70 216, 100 246, 156 246 L 242 246 Z M 242 120 L 168 120 C 130 120, 110 138, 110 166 C 110 194, 130 212, 168 212 L 242 212 Z"/>
  <path fill="#FFFFFF" fill-rule="evenodd" d="M 242 266 L 146 266 C 86 266, 54 298, 54 346 C 54 394, 86 426, 146 426 L 242 426 Z M 242 300 L 158 300 C 122 300, 100 320, 100 346 C 100 372, 122 392, 158 392 L 242 392 Z"/>
  <!-- Right B solid orange -->
  <path fill="#F39323" fill-rule="evenodd" d="M 270 86 L 356 86 C 412 86, 442 116, 442 166 C 442 216, 412 246, 356 246 L 270 246 Z M 270 120 L 344 120 C 382 120, 402 138, 402 166 C 402 194, 382 212, 344 212 L 270 212 Z"/>
  <path fill="#F39323" fill-rule="evenodd" d="M 270 266 L 366 266 C 426 266, 458 298, 458 346 C 458 394, 426 426, 366 426 L 270 426 Z M 270 300 L 354 300 C 390 300, 412 320, 412 346 C 412 372, 390 392, 354 392 L 270 392 Z"/>
  <!-- Editorial rule + eyebrow -->
  <rect x="54" y="462" width="404" height="2" fill="#FFFFFF" opacity="0.2"/>
  <text x="54" y="488" font-family="'DM Sans',system-ui,sans-serif"
        font-size="14" font-weight="600" fill="#FFFFFF" letter-spacing="3" opacity="0.55">BULLETIN · BOARD · DELLS</text>
</svg>
