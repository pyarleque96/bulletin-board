<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Bulletin Board">
  <title>Bulletin Board – Stencil App Icon (Dark ink on light surface)</title>
  <!-- Editorial / stencil treatment: sharp 20px corner radius (NOT Booking's softer 24-32),
       Bs are typeset-confident slabs with no decorative gimmicks, eyebrow micro-label at bottom,
       a thin orange tab on the left edge as a vertical accent. -->
  <rect width="512" height="512" rx="20" ry="20" fill="#FFFFFF"/>
  <!-- Vertical orange accent tab — editorial signature, NOT a Booking trait -->
  <rect x="0" y="120" width="14" height="200" fill="#F39323"/>
  <!-- Left B in navy -->
  <rect x="242" y="86" width="28" height="340" fill="#101A3D"/>
  <path fill="#101A3D" fill-rule="evenodd" d="M 242 86 L 156 86 C 100 86, 70 116, 70 166 C 70 216, 100 246, 156 246 L 242 246 Z M 242 120 L 168 120 C 130 120, 110 138, 110 166 C 110 194, 130 212, 168 212 L 242 212 Z"/>
  <path fill="#101A3D" fill-rule="evenodd" d="M 242 266 L 146 266 C 86 266, 54 298, 54 346 C 54 394, 86 426, 146 426 L 242 426 Z M 242 300 L 158 300 C 122 300, 100 320, 100 346 C 100 372, 122 392, 158 392 L 242 392 Z"/>
  <!-- Right B in orange -->
  <path fill="#F39323" fill-rule="evenodd" d="M 270 86 L 356 86 C 412 86, 442 116, 442 166 C 442 216, 412 246, 356 246 L 270 246 Z M 270 120 L 344 120 C 382 120, 402 138, 402 166 C 402 194, 382 212, 344 212 L 270 212 Z"/>
  <path fill="#F39323" fill-rule="evenodd" d="M 270 266 L 366 266 C 426 266, 458 298, 458 346 C 458 394, 426 426, 366 426 L 270 426 Z M 270 300 L 354 300 C 390 300, 412 320, 412 346 C 412 372, 390 392, 354 392 L 270 392 Z"/>
  <rect x="54" y="462" width="404" height="2" fill="#101A3D" opacity="0.25"/>
  <text x="54" y="488" font-family="'DM Sans',system-ui,sans-serif"
        font-size="14" font-weight="600" fill="#101A3D" letter-spacing="3" opacity="0.6">BULLETIN · BOARD · DELLS</text>
</svg>
