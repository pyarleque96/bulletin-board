<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skeleton — Car Rental Listing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', system-ui, sans-serif; background: #F8FAFC; }

    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .sk {
      background: linear-gradient(90deg, #E2E8F0 25%, #F1F5F9 50%, #E2E8F0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.8s ease-in-out infinite;
      border-radius: 6px;
    }

    .sk-d1 { animation-delay: 0s; }
    .sk-d2 { animation-delay: 0.1s; }
    .sk-d3 { animation-delay: 0.2s; }
    .sk-d4 { animation-delay: 0.3s; }
    .sk-d5 { animation-delay: 0.4s; }
    .sk-d6 { animation-delay: 0.5s; }

    .page-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    @media (min-width: 900px) {
      .page-layout { grid-template-columns: 1fr 340px; }
    }

    /* Tab active simulation */
    .tab-active {
      border-bottom: 2px solid #E2E8F0;
      padding-bottom: 10px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body aria-busy="true">

<!-- NAV -->
<div style="background:white; border-bottom:1px solid #F1F5F9; padding:16px 24px;">
  <div style="max-width:1100px; margin:0 auto; display:flex; align-items:center; justify-content:space-between;">
    <div class="sk sk-d1" style="width:140px; height:26px;"></div>
    <div class="sk sk-d2" style="width:90px; height:34px; border-radius:999px;"></div>
  </div>
</div>

<!-- HERO IMAGE with overlay -->
<div style="position:relative; width:100%; height:clamp(240px, 40vw, 480px); overflow:hidden;">
  <div class="sk sk-d1" style="position:absolute; inset:0; border-radius:0;"></div>
  <!-- Overlay badge -->
  <div style="
    position:absolute;
    top:20px; left:24px;
    display:flex; gap:8px;
  ">
    <div class="sk sk-d2" style="width:64px; height:24px; border-radius:999px;"></div>
    <div class="sk sk-d3" style="width:48px; height:24px; border-radius:999px;"></div>
  </div>
  <!-- Bottom overlay info -->
  <div style="
    position:absolute;
    bottom:0; left:0; right:0;
    padding:20px 24px;
    background: linear-gradient(to top, rgba(15,23,42,0.7), transparent);
  ">
    <div class="sk sk-d4" style="width:200px; height:26px; border-radius:8px; background: rgba(255,255,255,0.2); animation:none;"></div>
  </div>
</div>

<div class="page-layout">

  <!-- LEFT: Main content -->
  <main>

    <!-- Title + badges -->
    <div style="margin-bottom:20px;">
      <div class="sk sk-d1" style="height:30px; width:75%; border-radius:8px; margin-bottom:10px;"></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <div class="sk sk-d2" style="width:60px; height:22px; border-radius:999px;"></div>
        <div class="sk sk-d3" style="width:80px; height:22px; border-radius:999px;"></div>
        <div class="sk sk-d4" style="width:50px; height:22px; border-radius:999px;"></div>
      </div>
    </div>

    <!-- TABS skeleton -->
    <div style="border-bottom:1px solid #E2E8F0; margin-bottom:24px; display:flex; gap:0;">
      <!-- Tab 1 (active look) -->
      <div style="padding:10px 20px 12px; border-bottom:2px solid #3B82F6; margin-bottom:-1px;">
        <div class="sk sk-d1" style="width:70px; height:13px;"></div>
      </div>
      <!-- Tab 2 -->
      <div style="padding:10px 20px 12px;">
        <div class="sk sk-d2" style="width:64px; height:13px;"></div>
      </div>
      <!-- Tab 3 -->
      <div style="padding:10px 20px 12px;">
        <div class="sk sk-d3" style="width:80px; height:13px;"></div>
      </div>
    </div>

    <!-- Specs grid (4 items) -->
    <div style="margin-bottom:28px;">
      <div class="sk sk-d2" style="width:100px; height:14px; margin-bottom:16px;"></div>
      <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:16px;">

        <!-- Spec item 1 -->
        <div style="display:flex; align-items:center; gap:12px; padding:16px; background:white; border-radius:12px; border:1px solid #F1F5F9;">
          <div class="sk sk-d1" style="width:36px; height:36px; border-radius:50%; flex-shrink:0;"></div>
          <div style="flex:1;">
            <div class="sk sk-d2" style="height:12px; width:60%; margin-bottom:6px;"></div>
            <div class="sk sk-d3" style="height:15px; width:40%;"></div>
          </div>
        </div>

        <!-- Spec item 2 -->
        <div style="display:flex; align-items:center; gap:12px; padding:16px; background:white; border-radius:12px; border:1px solid #F1F5F9;">
          <div class="sk sk-d2" style="width:36px; height:36px; border-radius:50%; flex-shrink:0;"></div>
          <div style="flex:1;">
            <div class="sk sk-d3" style="height:12px; width:55%; margin-bottom:6px;"></div>
            <div class="sk sk-d4" style="height:15px; width:50%;"></div>
          </div>
        </div>

        <!-- Spec item 3 -->
        <div style="display:flex; align-items:center; gap:12px; padding:16px; background:white; border-radius:12px; border:1px solid #F1F5F9;">
          <div class="sk sk-d3" style="width:36px; height:36px; border-radius:50%; flex-shrink:0;"></div>
          <div style="flex:1;">
            <div class="sk sk-d4" style="height:12px; width:70%; margin-bottom:6px;"></div>
            <div class="sk sk-d5" style="height:15px; width:35%;"></div>
          </div>
        </div>

        <!-- Spec item 4 -->
        <div style="display:flex; align-items:center; gap:12px; padding:16px; background:white; border-radius:12px; border:1px solid #F1F5F9;">
          <div class="sk sk-d4" style="width:36px; height:36px; border-radius:50%; flex-shrink:0;"></div>
          <div style="flex:1;">
            <div class="sk sk-d5" style="height:12px; width:65%; margin-bottom:6px;"></div>
            <div class="sk sk-d6" style="height:15px; width:45%;"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- Gallery (4 rects) -->
    <div>
      <div class="sk sk-d3" style="width:80px; height:14px; margin-bottom:16px;"></div>
      <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px;">
        <div class="sk sk-d1" style="aspect-ratio:4/3; border-radius:10px;"></div>
        <div class="sk sk-d2" style="aspect-ratio:4/3; border-radius:10px;"></div>
        <div class="sk sk-d3" style="aspect-ratio:4/3; border-radius:10px;"></div>
        <div class="sk sk-d4" style="aspect-ratio:4/3; border-radius:10px;"></div>
      </div>
    </div>

  </main>

  <!-- RIGHT: Pricing sidebar -->
  <aside>
    <div style="
      padding: 8px;
      background: rgba(255,255,255,0.9);
      border-radius: 1.5rem;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.05);
      position: sticky;
      top: 24px;
    ">
      <div style="
        background: white;
        border-radius: calc(1.5rem - 6px);
        padding: 24px;
        box-shadow: inset 0 1px 1px rgba(255,255,255,0.8);
      ">
        <!-- Eyebrow -->
        <div class="sk sk-d1" style="width:80px; height:18px; border-radius:999px; margin-bottom:14px;"></div>

        <!-- Price big -->
        <div class="sk sk-d2" style="height:40px; width:55%; border-radius:8px; margin-bottom:6px;"></div>
        <div class="sk sk-d3" style="height:12px; width:80%; margin-bottom:20px;"></div>

        <!-- Divider -->
        <div style="height:1px; background:#F1F5F9; margin-bottom:20px;"></div>

        <!-- Date range pickers -->
        <div class="sk sk-d4" style="height:13px; width:50px; margin-bottom:8px;"></div>
        <div class="sk sk-d4" style="height:44px; width:100%; border-radius:10px; margin-bottom:12px;"></div>
        <div class="sk sk-d5" style="height:13px; width:50px; margin-bottom:8px;"></div>
        <div class="sk sk-d5" style="height:44px; width:100%; border-radius:10px; margin-bottom:20px;"></div>

        <!-- Breakdown rows -->
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
          <div class="sk sk-d4" style="width:100px; height:12px;"></div>
          <div class="sk sk-d4" style="width:50px; height:12px;"></div>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
          <div class="sk sk-d5" style="width:80px; height:12px;"></div>
          <div class="sk sk-d5" style="width:40px; height:12px;"></div>
        </div>

        <!-- Divider -->
        <div style="height:1px; background:#F1F5F9; margin:14px 0;"></div>

        <!-- Total -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
          <div class="sk sk-d5" style="width:50px; height:14px;"></div>
          <div class="sk sk-d6" style="width:70px; height:22px; border-radius:6px;"></div>
        </div>

        <!-- CTA button -->
        <div class="sk sk-d6" style="width:100%; height:48px; border-radius:999px;"></div>

        <!-- Disclaimer -->
        <div class="sk sk-d6" style="width:80%; height:11px; margin:12px auto 0;"></div>
      </div>
    </div>
  </aside>

</div>

<div role="status" class="sr-only" aria-live="polite">
  Loading car rental details — Cargando detalles del auto
</div>

</body>
</html>
