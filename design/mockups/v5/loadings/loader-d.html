<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulletin Dells — Map Pin Reveal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #F8FAFC;
      overflow: hidden;
      min-height: 100dvh;
    }

    /* Radial gradient background texture */
    .bg-radial {
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, rgba(59,130,246,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(249,115,22,0.04) 0%, transparent 60%),
        #F8FAFC;
    }

    /* SVG Map Pin stroke-dashoffset animation */
    /* The pin path total length ~= 200; adjust dasharray to match actual SVG path */

    .pin-circle {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: draw-circle 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    .pin-inner-circle {
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: draw-circle 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
    }

    .pin-stem {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: draw-circle 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards;
    }

    @keyframes draw-circle {
      to { stroke-dashoffset: 0; }
    }

    /* Pin fill appears after draw */
    .pin-fill-circle {
      opacity: 0;
      animation: fill-appear 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
    }

    .pin-fill-inner {
      opacity: 0;
      animation: fill-appear 0.3s cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards;
    }

    @keyframes fill-appear {
      to { opacity: 1; }
    }

    /* Ripple ring from pin drop */
    @keyframes ripple {
      0%   { transform: scale(0.5); opacity: 0.5; }
      100% { transform: scale(2.5); opacity: 0; }
    }

    .ripple-1 {
      animation: ripple 1.2s cubic-bezier(0.16, 1, 0.3, 1) 2s infinite;
    }

    .ripple-2 {
      animation: ripple 1.2s cubic-bezier(0.16, 1, 0.3, 1) 2.3s infinite;
    }

    /* Text reveal */
    @keyframes text-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .text-line-1 {
      animation: text-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.8s both;
    }

    .text-line-2 {
      animation: text-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) 2s both;
    }

    .text-sub {
      animation: text-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) 2.2s both;
    }

    /* Logo mark */
    @keyframes wordmark-in {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .wordmark-in {
      animation: wordmark-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }

    /* Fade out the whole loader when done — triggered by JS class */
    .loader-fadeout {
      animation: fadeout 0.7s cubic-bezier(0.76, 0, 0.24, 1) forwards;
    }

    @keyframes fadeout {
      to { opacity: 0; pointer-events: none; }
    }

    /* Eyebrow */
    .eyebrow {
      display: inline-block;
      background: #EFF6FF;
      color: #3B82F6;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>

<div
  id="loader"
  class="bg-radial min-h-[100dvh] flex flex-col items-center justify-center gap-8"
  role="status"
  aria-label="Connecting you to Wisconsin Dells — Conectándote con Wisconsin Dells"
  aria-busy="true"
>

  <!-- Top wordmark -->
  <div class="wordmark-in" style="text-align:center;">
    <span class="eyebrow">Bulletin Dells</span>
  </div>

  <!-- Animated Map Pin SVG -->
  <div style="position:relative; width:120px; height:140px; display:flex; align-items:center; justify-content:center;">

    <!-- Ripple rings (from pin base) -->
    <div class="ripple-1" style="
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform-origin: center;
      width: 28px;
      height: 14px;
      margin-left: -14px;
      border-radius: 50%;
      border: 2px solid #3B82F6;
      pointer-events: none;
    " aria-hidden="true"></div>

    <div class="ripple-2" style="
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform-origin: center;
      width: 28px;
      height: 14px;
      margin-left: -14px;
      border-radius: 50%;
      border: 2px solid #3B82F6;
      pointer-events: none;
    " aria-hidden="true"></div>

    <!-- SVG Pin -->
    <svg
      width="80"
      height="100"
      viewBox="0 0 80 100"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
      style="filter: drop-shadow(0 8px 24px rgba(59,130,246,0.18));"
    >
      <!-- Pin fill (circle background) -->
      <circle class="pin-fill-circle" cx="40" cy="34" r="28" fill="#3B82F6" />

      <!-- Pin outer circle stroke — drawn first -->
      <circle
        class="pin-circle"
        cx="40" cy="34" r="28"
        stroke="#3B82F6"
        stroke-width="3"
        fill="none"
        stroke-linecap="round"
      />

      <!-- Inner dot fill -->
      <circle class="pin-fill-inner" cx="40" cy="34" r="11" fill="white" />

      <!-- Inner dot stroke -->
      <circle
        class="pin-inner-circle"
        cx="40" cy="34" r="11"
        stroke="white"
        stroke-width="2.5"
        fill="none"
        stroke-linecap="round"
      />

      <!-- Stem stroke -->
      <line
        class="pin-stem"
        x1="40" y1="62"
        x2="40" y2="94"
        stroke="#3B82F6"
        stroke-width="4"
        stroke-linecap="round"
      />
    </svg>
  </div>

  <!-- Text block -->
  <div style="text-align:center; max-width:320px; padding:0 24px;">
    <h2 class="text-line-1" style="font-size:clamp(18px,4vw,24px); font-weight:700; color:#1E293B; letter-spacing:-0.5px; margin-bottom:6px;">
      Connecting you to Wisconsin Dells
    </h2>
    <p class="text-line-2" style="font-size:14px; font-weight:400; color:#3B82F6; margin-bottom:12px;">
      Conectándote con Wisconsin Dells
    </p>
    <p class="text-sub" style="font-size:13px; font-weight:400; color:#94A3B8; line-height:1.5;">
      Finding the best local services in your area
    </p>
  </div>

  <!-- Minimal progress dots -->
  <div class="text-sub" style="display:flex; gap:6px; align-items:center;" aria-hidden="true">
    <span style="width:6px;height:6px;border-radius:50%;background:#3B82F6;opacity:1;"></span>
    <span style="width:6px;height:6px;border-radius:50%;background:#3B82F6;opacity:0.5;"></span>
    <span style="width:6px;height:6px;border-radius:50%;background:#3B82F6;opacity:0.25;"></span>
  </div>

</div>

<script>
  // After ~4s, add fade-out class to simulate completion
  // In Blazor this would be triggered by the app signaling it's ready
  var loader = document.getElementById('loader');
  if (loader) {
    setTimeout(function() {
      loader.setAttribute('aria-busy', 'false');
      loader.classList.add('loader-fadeout');
    }, 4200);
  }
</script>

</body>
</html>
