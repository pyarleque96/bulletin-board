<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulletin Dells — Cinematic Split</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #F8FAFC;
      overflow: hidden;
    }

    .loader-root {
      position: relative;
      width: 100vw;
      min-height: 100dvh;
      display: flex;
      overflow: hidden;
    }

    /* LEFT PANEL — starts at 50% then expands to 60% briefly, then curtain opens */
    .panel-left {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 50%;
      background: #3B82F6;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      /* Curtain opens: slides to the left */
      animation: curtain-left 0.8s cubic-bezier(0.76, 0, 0.24, 1) 2.8s forwards;
      will-change: transform;
    }

    .panel-right {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 50%;
      background: #F8FAFC;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 6%;
      z-index: 10;
      animation: curtain-right 0.8s cubic-bezier(0.76, 0, 0.24, 1) 2.8s forwards;
      will-change: transform;
    }

    @keyframes curtain-left {
      to { transform: translateX(-100%); }
    }

    @keyframes curtain-right {
      to { transform: translateX(100%); }
    }

    /* Hairline divider */
    .divider {
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      width: 1px;
      background: rgba(255,255,255,0.25);
      z-index: 20;
      animation: divider-fade 0.8s cubic-bezier(0.76, 0, 0.24, 1) 2.8s forwards;
    }

    @keyframes divider-fade {
      to { opacity: 0; }
    }

    /* Content behind the curtain (revealed after) */
    .content-behind {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      opacity: 0;
      animation: reveal-behind 0.6s cubic-bezier(0.16, 1, 0.3, 1) 3.4s forwards;
    }

    @keyframes reveal-behind {
      to { opacity: 1; }
    }

    /* Logo on left panel */
    @keyframes logo-in {
      from { opacity: 0; transform: scale(0.92) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .logo-left {
      animation: logo-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }

    /* Right panel text */
    @keyframes text-in {
      from { opacity: 0; transform: translateX(-16px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .right-eyebrow {
      animation: text-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
    }

    .right-headline {
      animation: text-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both;
    }

    .right-sub {
      animation: text-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both;
    }

    /* Counter animation */
    .counter-wrap {
      animation: text-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both;
    }

    /* Counter fills via JS or CSS counter trick */
    @keyframes count-up {
      from { --n: 0; }
      to   { --n: 100; }
    }

    /* Progress line under counter */
    @keyframes line-grow {
      from { width: 0%; }
      to   { width: 100%; }
    }

    .progress-line {
      animation: line-grow 2.4s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }

    /* Mobile: stack vertically */
    @media (max-width: 767px) {
      .panel-left  { width: 100%; height: 50%; top: 0; bottom: auto; left: 0; right: 0; animation: curtain-top 0.8s cubic-bezier(0.76, 0, 0.24, 1) 2.8s forwards; }
      .panel-right { width: 100%; height: 50%; top: 50%; left: 0; right: 0; padding-left: 0; justify-content: center; animation: curtain-bottom 0.8s cubic-bezier(0.76, 0, 0.24, 1) 2.8s forwards; }
      .divider     { top: 50%; bottom: auto; left: 0; right: 0; width: 100%; height: 1px; }
      @keyframes curtain-top    { to { transform: translateY(-100%); } }
      @keyframes curtain-bottom { to { transform: translateY(100%); } }
    }
  </style>
</head>
<body>

<div class="loader-root" role="status" aria-label="Loading Bulletin Dells — Cargando" aria-busy="true">

  <!-- Curtain: Left blue panel -->
  <div class="panel-left">
    <div class="logo-left text-center">
      <svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Bulletin Dells mark">
        <circle cx="26" cy="22" r="14" fill="white" fill-opacity="0.25" />
        <circle cx="26" cy="22" r="7" fill="white" />
        <line x1="26" y1="36" x2="26" y2="50" stroke="white" stroke-width="4" stroke-linecap="round" />
      </svg>
      <p style="color:white; font-size:13px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; margin-top:16px; opacity:0.7;">
        Bulletin Dells
      </p>
    </div>
  </div>

  <!-- Divider -->
  <div class="divider" aria-hidden="true"></div>

  <!-- Curtain: Right light panel -->
  <div class="panel-right">
    <div>
      <!-- Eyebrow tag -->
      <div class="right-eyebrow" style="margin-bottom:12px;">
        <span style="
          display:inline-block;
          background:#EFF6FF;
          color:#3B82F6;
          font-size:10px;
          font-weight:600;
          letter-spacing:0.18em;
          text-transform:uppercase;
          padding:4px 12px;
          border-radius:999px;
        ">Wisconsin Dells</span>
      </div>

      <!-- Headline -->
      <div class="right-headline" style="margin-bottom:10px;">
        <h1 style="font-size:clamp(24px,4vw,40px); font-weight:900; color:#1E293B; line-height:1.1; letter-spacing:-1px; max-width:320px;">
          Your local<br/>marketplace
        </h1>
      </div>

      <!-- Sub -->
      <div class="right-sub" style="margin-bottom:28px;">
        <p style="font-size:13px; font-weight:400; color:#64748B; max-width:260px; line-height:1.6;">
          Connecting you to trusted local services since day one.
        </p>
      </div>

      <!-- Counter -->
      <div class="counter-wrap">
        <div id="counter" style="font-size:clamp(40px,6vw,64px); font-weight:900; color:#1E293B; letter-spacing:-2px; line-height:1;">
          0%
        </div>
        <!-- Progress line -->
        <div style="margin-top:10px; height:2px; background:#E2E8F0; border-radius:999px; overflow:hidden; max-width:200px;">
          <div class="progress-line" style="height:100%; background:#3B82F6; border-radius:999px; width:0%;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Content revealed after curtain -->
  <div class="content-behind" aria-hidden="true">
    <p style="font-family:'DM Sans',sans-serif; font-size:14px; color:#94A3B8; letter-spacing:0.05em;">
      Ready — Listo
    </p>
  </div>

</div>

<script>
  // Animate counter 0 → 100 over ~2.5s starting at 1s
  (function() {
    var el = document.getElementById('counter');
    if (!el) return;
    var start = null;
    var duration = 2400;
    var delay = 900;

    function step(ts) {
      if (!start) start = ts;
      var elapsed = ts - start;
      var progress = Math.min(elapsed / duration, 1);
      // ease-out cubic
      var eased = 1 - Math.pow(1 - progress, 3);
      var val = Math.floor(eased * 100);
      el.textContent = val + '%';
      if (progress < 1) requestAnimationFrame(step);
    }

    setTimeout(function() {
      requestAnimationFrame(step);
    }, delay);
  })();
</script>

</body>
</html>
