<!--
  SCREEN: 02 — Noise Grain + Bilingual Fade
  SPEC: Fullscreen, light theme, white bg
  CUANDO: Transición entre rutas largas (category change, deep link)
  CONCEPTO: Capa de ruido SVG fija (pointer-events-none), fade in/out de palabras
            bilingüe en DM Serif Display, sensación editorial / high-end print.
            Las palabras aparecen y desaparecen alternando EN/ES como un magazine de lujo.
            Inspiración: Airbnb brand loading, editorial fashion sites.
  HIGH-END: Editorial Luxury vibe — grain sutil (opacity 0.025), no dark,
            serif enorme pero restrained, no neon.
  BLAZOR HOOK: Activar entre route navigations largas; desmontar tras
               OnAfterRenderAsync con flag IsReady.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulletin Dells — Loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── ANTI-FOUC ── */
    html { background: #ffffff; }
    body {
      opacity: 0;
      animation: body-fade-in 0.45s cubic-bezier(0.32,0.72,0,1) 0.08s forwards;
    }
    @keyframes body-fade-in { to { opacity: 1; } }

    /* Stage */
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      overflow: hidden;
    }

    /* ── Film grain overlay — fixed, pointer-events-none ── */
    .grain-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 128px 128px;
    }

    /* ── Word cycling system ── */
    .word-stage {
      position: relative;
      z-index: 2;
      text-align: center;
      height: clamp(5rem, 12vw, 9rem);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .word-item {
      position: absolute;
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #1e293b;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.6s cubic-bezier(0.32,0.72,0,1),
                  transform 0.6s cubic-bezier(0.32,0.72,0,1);
      white-space: nowrap;
    }
    .word-item.italic {
      font-style: italic;
      color: #fd8c1b;
    }
    .word-item.active {
      opacity: 1;
      transform: translateY(0);
    }
    .word-item.exit {
      opacity: 0;
      transform: translateY(-14px);
      transition: opacity 0.4s cubic-bezier(0.32,0.72,0,1),
                  transform 0.4s cubic-bezier(0.32,0.72,0,1);
    }

    /* Small language label beneath */
    .lang-label {
      position: relative;
      z-index: 2;
      margin-top: 1.25rem;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #94a3b8;
      opacity: 0;
      animation: label-in 0.5s cubic-bezier(0.32,0.72,0,1) 0.6s forwards;
    }
    @keyframes label-in { to { opacity: 1; } }

    /* Active language dot */
    .lang-dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fd8c1b;
      vertical-align: middle;
      margin: 0 6px;
      transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
    }

    /* Hairline divider */
    .divider {
      position: relative;
      z-index: 2;
      width: 40px;
      height: 1px;
      background: #e2e8f0;
      margin: 2.5rem auto 0;
      opacity: 0;
      animation: label-in 0.5s cubic-bezier(0.32,0.72,0,1) 0.8s forwards;
    }

    /* Brand wordmark — bottom left editorial stamp */
    .brand-stamp {
      position: fixed;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #cbd5e1;
      opacity: 0;
      animation: label-in 0.5s cubic-bezier(0.32,0.72,0,1) 1.1s forwards;
      white-space: nowrap;
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- Film grain overlay — fixed/pointer-events-none -->
  <div class="grain-overlay" aria-hidden="true"></div>

  <div class="stage" role="status" aria-live="polite" aria-label="Loading Bulletin Dells · Cargando Bulletin Dells">

    <!-- Word cycling -->
    <div class="word-stage" aria-label="Loading" id="wordStage">
      <span class="word-item active" data-index="0">Listings</span>
      <span class="word-item italic" data-index="1">Servicios</span>
      <span class="word-item" data-index="2">Providers</span>
      <span class="word-item italic" data-index="3">Vivienda</span>
      <span class="word-item" data-index="4">Transport</span>
      <span class="word-item italic" data-index="5">Mecánicos</span>
      <span class="word-item" data-index="6">Wisconsin Dells</span>
    </div>

    <!-- Language label -->
    <p class="lang-label" id="langLabel">
      <span id="langText">English</span>
      <span class="lang-dot" id="langDot"></span>
      <span id="langTextEs">Español</span>
    </p>

    <!-- Hairline -->
    <div class="divider" aria-hidden="true"></div>

    <!-- Bottom stamp -->
    <div class="brand-stamp" aria-hidden="true">Bulletin Dells · Local Marketplace · Wisconsin</div>

  </div>

  <script>
    /* Word cycling — alternates EN/ES pairs */
    /* BLAZOR HOOK: Replace with Blazor component lifecycle / StateHasChanged */
    const items = document.querySelectorAll('.word-item');
    let current = 0;

    function next() {
      items[current].classList.remove('active');
      items[current].classList.add('exit');

      const prev = current;
      current = (current + 1) % items.length;

      setTimeout(() => {
        items[prev].classList.remove('exit');
      }, 450);

      items[current].classList.add('active');
    }

    // Start cycling after 1.2s
    const timer = setInterval(next, 1800);

    // Cleanup (Blazor would handle via IDisposable)
    // clearInterval(timer);
  </script>
</body>
</html>
