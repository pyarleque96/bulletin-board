<!--
  SCREEN: 07 — Vinyl Record
  SPEC: Fullscreen, light theme, white bg
  CUANDO: Carga de listados de entretenimiento / servicios de música / rides
  CONCEPTO: Disco de vinilo SVG girando con label central naranja "BD",
            surco con brillo radial que recorre la superficie a medida que gira.
            Sensación nostálgica-premium — Yellow Pages tribute + modernidad.
  HIGH-END: Soft Structuralism vibe. Double-Bezel alrededor del disco.
            Gradiente radial sutil para simular profundidad de surco.
            Brillo tipo highlight recorre el borde exterior.
  BLAZOR HOOK: Montar en carga de categoría "Entertainment" o como loader genérico.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulletin Dells — Loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── ANTI-FOUC ── */
    html { background: #ffffff; }
    body {
      opacity: 0;
      animation: body-fade-in 0.45s cubic-bezier(0.32,0.72,0,1) 0.08s forwards;
    }
    @keyframes body-fade-in { to { opacity: 1; } }

    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      overflow: hidden;
    }

    /* ── Vinyl record — Double Bezel ── */
    .vinyl-shell {
      opacity: 0;
      transform: scale(0.88);
      animation: vinyl-intro 0.9s cubic-bezier(0.32,0.72,0,1) 0.3s forwards;
    }
    @keyframes vinyl-intro {
      to { opacity: 1; transform: scale(1); }
    }

    /* Outer bezel */
    .bezel-outer {
      width: 13rem;
      height: 13rem;
      border-radius: 50%;
      background: rgba(0,0,0,0.02);
      border: 1px solid rgba(30,41,59,0.05);
      padding: 8px;
      box-shadow:
        0 0 0 1px rgba(30,41,59,0.03),
        0 20px 60px -20px rgba(30,41,59,0.12);
    }
    /* Inner core — the actual disk container */
    .bezel-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #f8fafc;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* The rotating vinyl SVG */
    .vinyl-disc {
      width: 10.5rem;
      height: 10.5rem;
      animation: vinyl-spin 3.2s linear infinite;
      will-change: transform;
    }
    @keyframes vinyl-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Highlight that sweeps the groove — counter-rotates to appear stationary */
    .vinyl-glare {
      position: absolute;
      width: 10.5rem;
      height: 10.5rem;
      border-radius: 50%;
      background: conic-gradient(
        transparent 0deg,
        transparent 280deg,
        rgba(255,255,255,0.35) 310deg,
        rgba(255,255,255,0.12) 340deg,
        transparent 360deg
      );
      pointer-events: none;
      /* Counter-rotate at different speed for shimmer effect */
      animation: glare-spin 5s linear infinite;
      will-change: transform;
    }
    @keyframes glare-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ── Labels ── */
    .vinyl-labels {
      margin-top: 2rem;
      text-align: center;
      opacity: 0;
      transform: translateY(8px);
      animation: lab-in 0.6s cubic-bezier(0.32,0.72,0,1) 0.85s forwards;
    }
    @keyframes lab-in {
      to { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #64748b;
    }
    .sub {
      margin-top: 0.5rem;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #cbd5e1;
    }

    /* ── Ambient halo ── */
    .halo {
      position: absolute;
      width: 18rem;
      height: 18rem;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(253,140,27,0.05) 0%, transparent 68%);
      pointer-events: none;
      opacity: 0;
      animation: halo-in 1.4s cubic-bezier(0.32,0.72,0,1) 0.4s forwards;
    }
    @keyframes halo-in { to { opacity: 1; } }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage" role="status" aria-live="polite" aria-label="Loading Bulletin Dells · Cargando Bulletin Dells">

    <!-- Ambient halo -->
    <div class="halo" aria-hidden="true"></div>

    <!-- Vinyl disk — Double Bezel -->
    <div class="vinyl-shell" aria-hidden="true">
      <div class="bezel-outer">
        <div class="bezel-inner">

          <!-- Rotating vinyl SVG -->
          <svg class="vinyl-disc" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <!-- Grooves — dark base -->
              <radialGradient id="vinyl-base" cx="50%" cy="50%" r="50%">
                <stop offset="0%"   stop-color="#2d3748"/>
                <stop offset="100%" stop-color="#1a202c"/>
              </radialGradient>
              <!-- Groove rings gradient — subtle sheen -->
              <radialGradient id="groove-sheen" cx="40%" cy="35%" r="65%">
                <stop offset="0%"   stop-color="rgba(255,255,255,0.06)"/>
                <stop offset="60%"  stop-color="rgba(0,0,0,0)"/>
                <stop offset="100%" stop-color="rgba(0,0,0,0.08)"/>
              </radialGradient>
              <!-- Label gradient -->
              <radialGradient id="label-grad" cx="50%" cy="40%" r="55%">
                <stop offset="0%"   stop-color="#ff9a2e"/>
                <stop offset="100%" stop-color="#fd8c1b"/>
              </radialGradient>
            </defs>

            <!-- Outer disk -->
            <circle cx="70" cy="70" r="68" fill="url(#vinyl-base)"/>
            <!-- Groove sheen -->
            <circle cx="70" cy="70" r="68" fill="url(#groove-sheen)"/>

            <!-- Groove rings — subtle opacity differences -->
            <circle cx="70" cy="70" r="62" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
            <circle cx="70" cy="70" r="56" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
            <circle cx="70" cy="70" r="50" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
            <circle cx="70" cy="70" r="44" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
            <circle cx="70" cy="70" r="38" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
            <circle cx="70" cy="70" r="32" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1.5"/>

            <!-- Label area — orange center -->
            <circle cx="70" cy="70" r="24" fill="url(#label-grad)"/>
            <!-- Label inner highlight -->
            <circle cx="70" cy="70" r="24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
            <!-- Label shine -->
            <ellipse cx="65" cy="63" rx="10" ry="6" fill="rgba(255,255,255,0.12)"/>

            <!-- BD lettering on label -->
            <text x="70" y="67" text-anchor="middle"
                  font-family="Outfit, system-ui, sans-serif"
                  font-weight="700"
                  font-size="11"
                  fill="rgba(255,255,255,0.95)"
                  letter-spacing="-0.5">BD</text>
            <text x="70" y="77" text-anchor="middle"
                  font-family="Outfit, system-ui, sans-serif"
                  font-weight="400"
                  font-size="4.5"
                  fill="rgba(255,255,255,0.6)"
                  letter-spacing="1">DELLS</text>

            <!-- Center hole -->
            <circle cx="70" cy="70" r="3" fill="#0f172a"/>
            <circle cx="70" cy="70" r="1.5" fill="#1e293b"/>
          </svg>

          <!-- Glare overlay -->
          <div class="vinyl-glare"></div>

        </div>
      </div>
    </div>

    <!-- Labels -->
    <div class="vinyl-labels">
      <p class="eyebrow">Spinning up local listings · Cargando servicios</p>
      <p class="sub">Bulletin Dells · Wisconsin · Est. 2024</p>
    </div>

  </div>
</body>
</html>
