<!--
  SCREEN: 09 — Postcard Stamp
  SPEC: Fullscreen, light theme, white bg
  CUANDO: Primera carga / splash screen con identidad local fuerte
  CONCEPTO: Postal vintage de Wisconsin Dells siendo "sellada" —
            una postal ilustrada con perforaciones aparece primero,
            luego un sello de goma BULLETÍN DELLS baja desde arriba
            y golpea con escala + opacidad, quedando impreso en naranja.
            Copy: "Delivering local listings · Entregando anuncios locales"
  HIGH-END: Z-Axis Cascade vibe — la postal es un elemento físico.
            Sello con ink-stamp effect: escala desde 1.2 → 1 con slight bounce.
            Perforaciones del sello SVG.
  BLAZOR HOOK: Cold start splash — desmontar tras OnAfterRenderAsync.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulletin Dells — Loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── ANTI-FOUC ── */
    html { background: #ffffff; }
    body {
      opacity: 0;
      animation: body-fade-in 0.45s cubic-bezier(0.32,0.72,0,1) 0.08s forwards;
    }
    @keyframes body-fade-in { to { opacity: 1; } }

    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fafaf9;
      overflow: hidden;
    }

    /* Subtle warm paper bg tint */
    .stage::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 50%,
        rgba(253,140,27,0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Postcard container ── */
    .postcard-scene {
      position: relative;
      opacity: 0;
      transform: translateY(20px);
      animation: card-in 0.8s cubic-bezier(0.32,0.72,0,1) 0.3s forwards;
    }
    @keyframes card-in { to { opacity: 1; transform: translateY(0); } }

    /* Postcard body */
    .postcard {
      width: min(22rem, 90vw);
      background: #fffef8;
      border-radius: 0.75rem;
      box-shadow:
        0 0 0 1px rgba(30,41,59,0.06),
        0 4px 6px -1px rgba(30,41,59,0.04),
        0 20px 50px -20px rgba(30,41,59,0.12);
      overflow: hidden;
      position: relative;
    }

    /* Postcard top illustration band */
    .card-top {
      height: 7rem;
      background: linear-gradient(135deg,
        #e2e8f0 0%, #f1f5f9 30%, #e8f0fe 60%, #f1f5f9 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Wisconsin Dells — tiny SVG landscape */
    .card-top svg {
      width: 100%;
      height: 100%;
    }

    /* Postcard perforated right border */
    .card-bottom {
      padding: 1rem 1.25rem 1.25rem;
      display: flex;
      gap: 1rem;
    }

    /* Left: address lines */
    .card-address {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .addr-line {
      height: 0.5rem;
      border-radius: 2px;
      background: #e2e8f0;
    }
    .addr-line:nth-child(1) { width: 75%; }
    .addr-line:nth-child(2) { width: 55%; }
    .addr-line:nth-child(3) { width: 65%; }

    .card-divider {
      width: 1px;
      background: repeating-linear-gradient(
        to bottom,
        #e2e8f0 0px,
        #e2e8f0 4px,
        transparent 4px,
        transparent 8px
      );
      margin: 0.25rem 0;
    }

    /* Right: stamp placeholder + real stamp overlay */
    .card-stamp-area {
      width: 3.5rem;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.4rem;
      position: relative;
    }

    /* Stamp SVG frame (perforated) — background placeholder */
    .stamp-frame {
      width: 3rem;
      height: 3.5rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 2px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    /* Perforated edge simulation */
    .stamp-frame::before,
    .stamp-frame::after {
      content: '';
      position: absolute;
      background: repeating-linear-gradient(
        90deg,
        transparent 0px, transparent 3px,
        #fafaf9 3px, #fafaf9 6px
      );
      height: 4px;
      left: -2px;
      right: -2px;
    }
    .stamp-frame::before { top: -2px; }
    .stamp-frame::after  { bottom: -2px; }

    .stamp-inner-text {
      font-family: 'DM Serif Display', serif;
      font-size: 0.45rem;
      color: #cbd5e1;
      text-align: center;
      line-height: 1.3;
    }

    /* ── THE STAMP — overlay that slams down ── */
    .stamp-overlay {
      position: absolute;
      /* Center over entire postcard */
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-12deg) scale(1.2);
      opacity: 0;
      z-index: 10;
      pointer-events: none;
      animation: stamp-slam 0.35s cubic-bezier(0.2,0.8,0.3,1) 1.6s forwards;
    }
    @keyframes stamp-slam {
      0%   { opacity: 0; transform: translate(-50%, -60%) rotate(-12deg) scale(1.3); }
      55%  { opacity: 0.95; transform: translate(-50%, -50%) rotate(-12deg) scale(0.96); }
      75%  { transform: translate(-50%, -50%) rotate(-12deg) scale(1.02); }
      100% { opacity: 0.9; transform: translate(-50%, -50%) rotate(-12deg) scale(1); }
    }

    .stamp-svg {
      width: 9rem;
      height: 9rem;
      filter: drop-shadow(0 2px 8px rgba(253,140,27,0.2));
    }

    /* ── Bottom label ── */
    .card-label {
      margin-top: 1.75rem;
      text-align: center;
      opacity: 0;
      transform: translateY(8px);
      animation: lab-in 0.6s cubic-bezier(0.32,0.72,0,1) 2s forwards;
    }
    @keyframes lab-in { to { opacity: 1; transform: translateY(0); } }

    .card-label-main {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #64748b;
    }
    .card-label-sub {
      margin-top: 0.35rem;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #cbd5e1;
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage" role="status" aria-live="polite" aria-label="Loading Bulletin Dells · Cargando Bulletin Dells">

    <div class="postcard-scene">

      <!-- The postcard -->
      <div class="postcard">

        <!-- Top illustration: simple SVG landscape of Wisconsin Dells -->
        <div class="card-top" aria-hidden="true">
          <svg viewBox="0 0 352 112" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
            <!-- Sky gradient -->
            <rect width="352" height="112" fill="url(#sky)"/>
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#bfdbfe"/>
                <stop offset="100%" stop-color="#e0f2fe"/>
              </linearGradient>
              <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#93c5fd"/>
                <stop offset="100%" stop-color="#60a5fa"/>
              </linearGradient>
            </defs>
            <!-- Water body (Dells river) -->
            <rect x="0" y="72" width="352" height="40" fill="url(#water)" rx="0"/>
            <!-- Water ripples -->
            <path d="M0 82 Q44 78 88 82 Q132 86 176 82 Q220 78 264 82 Q308 86 352 82" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
            <path d="M0 90 Q44 86 88 90 Q132 94 176 90 Q220 86 264 90 Q308 94 352 90" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.75"/>
            <!-- Rock formations left -->
            <path d="M0 72 L0 50 Q10 36 22 45 Q30 30 45 40 Q55 28 68 38 L80 72Z" fill="#94a3b8"/>
            <path d="M0 72 L0 52 Q8 42 18 48 Q26 36 38 44 Q46 30 56 40 L65 72Z" fill="#cbd5e1"/>
            <!-- Rock formations right -->
            <path d="M280 72 Q295 38 310 42 Q320 30 335 40 Q345 28 355 36 L355 72Z" fill="#94a3b8"/>
            <path d="M288 72 Q300 44 315 48 Q325 34 340 42 Q348 30 356 38 L356 72Z" fill="#cbd5e1"/>
            <!-- Pine trees center -->
            <polygon points="152,42 158,62 146,62" fill="#64748b"/>
            <polygon points="160,36 167,58 153,58" fill="#475569"/>
            <polygon points="176,40 182,60 170,60" fill="#64748b"/>
            <polygon points="184,38 191,62 177,62" fill="#475569"/>
            <!-- Sun top right -->
            <circle cx="300" cy="22" r="14" fill="rgba(253,203,110,0.8)"/>
            <circle cx="300" cy="22" r="10" fill="rgba(253,211,77,0.9)"/>
            <!-- Text overlay -->
            <text x="176" y="26" text-anchor="middle"
                  font-family="DM Serif Display, Georgia, serif"
                  font-size="14" fill="rgba(30,41,59,0.45)"
                  letter-spacing="2">WISCONSIN DELLS</text>
          </svg>
        </div>

        <!-- Bottom content -->
        <div class="card-bottom">
          <div class="card-address">
            <div class="addr-line"></div>
            <div class="addr-line"></div>
            <div class="addr-line"></div>
          </div>
          <div class="card-divider" aria-hidden="true"></div>
          <div class="card-stamp-area">
            <div class="stamp-frame" aria-hidden="true">
              <p class="stamp-inner-text">PLACE<br>STAMP<br>HERE</p>
            </div>
          </div>
        </div>

        <!-- Ink Stamp overlay — slams at 1.6s -->
        <div class="stamp-overlay" aria-hidden="true">
          <svg class="stamp-svg" viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
            <!-- Outer perforated circle -->
            <circle cx="72" cy="72" r="68" fill="none" stroke="#fd8c1b" stroke-width="2"
                    stroke-dasharray="4 3"/>
            <!-- Inner solid circle -->
            <circle cx="72" cy="72" r="58" fill="rgba(253,140,27,0.08)" stroke="#fd8c1b" stroke-width="1.5"/>
            <!-- Star accent lines -->
            <line x1="72" y1="18" x2="72" y2="26" stroke="#fd8c1b" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="72" y1="118" x2="72" y2="126" stroke="#fd8c1b" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="18" y1="72" x2="26" y2="72" stroke="#fd8c1b" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="118" y1="72" x2="126" y2="72" stroke="#fd8c1b" stroke-width="1.5" stroke-linecap="round"/>
            <!-- Main text arc top -->
            <path id="arc-top" d="M 28,72 A 44,44 0 0 1 116,72" fill="none"/>
            <text font-family="Outfit, sans-serif" font-weight="700" font-size="11"
                  fill="#fd8c1b" letter-spacing="3">
              <textPath href="#arc-top" startOffset="8%">BULLETIN DELLS</textPath>
            </text>
            <!-- Center text -->
            <text x="72" y="69" text-anchor="middle"
                  font-family="DM Serif Display, Georgia, serif"
                  font-size="18" fill="#fd8c1b">BD</text>
            <!-- Bottom arc -->
            <path id="arc-bot" d="M 28,72 A 44,44 0 0 0 116,72" fill="none"/>
            <text font-family="Outfit, sans-serif" font-weight="500" font-size="8"
                  fill="#fd8c1b" letter-spacing="2.5">
              <textPath href="#arc-bot" startOffset="12%">WISCONSIN · EST. 2024</textPath>
            </text>
          </svg>
        </div>

      </div>

      <!-- Label -->
      <div class="card-label">
        <p class="card-label-main">Delivering local listings · Entregando anuncios</p>
        <p class="card-label-sub">Bulletin Dells · Wisconsin Dells, WI</p>
      </div>

    </div>

  </div>
</body>
</html>
