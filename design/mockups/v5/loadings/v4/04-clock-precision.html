<!--
  SCREEN: 04 — Clock Precision (Swiss Watch)
  SPEC: Fullscreen, light theme, white bg
  CUANDO: Carga de sesión / datos de proveedor
  CONCEPTO: Reloj suizo SVG con minutero y segundero animados,
            segundero naranja (¡marca!), esfera minimalista sin números,
            solo marcas de hora muy finas.
            Eyebrow "Connecting · Conectando" debajo.
            Sensación: exactitud, profesionalismo, confianza — "trust-first".
  HIGH-END: Soft Structuralism — Double-bezel alrededor del reloj.
            Reloj encajado en shell/core nested (Doppelrand).
  BLAZOR HOOK: Usar en estado "Authenticating" o "Connecting to server".
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulletin Dells — Loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── ANTI-FOUC ── */
    html { background: #ffffff; }
    body {
      opacity: 0;
      animation: body-fade-in 0.45s cubic-bezier(0.32,0.72,0,1) 0.08s forwards;
    }
    @keyframes body-fade-in { to { opacity: 1; } }

    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      overflow: hidden;
    }

    /* ── Clock container — Double-Bezel ── */
    .clock-shell {
      opacity: 0;
      transform: scale(0.9);
      animation: clock-intro 0.9s cubic-bezier(0.32,0.72,0,1) 0.3s forwards;
    }
    @keyframes clock-intro {
      to { opacity: 1; transform: scale(1); }
    }

    /* Outer bezel */
    .bezel-outer {
      width: 11rem;
      height: 11rem;
      border-radius: 50%;
      background: rgba(0,0,0,0.025);
      border: 1px solid rgba(30,41,59,0.06);
      padding: 6px;
      box-shadow:
        0 0 0 1px rgba(30,41,59,0.03),
        0 20px 60px -20px rgba(30,41,59,0.08);
    }
    /* Inner core */
    .bezel-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.9),
                  inset 0 -1px 3px rgba(30,41,59,0.04);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Clock face SVG */
    .clock-svg {
      width: 8.5rem;
      height: 8.5rem;
    }

    /* ── SVG Hands — animated ── */
    /* Hour hand */
    .hand-hour {
      transform-origin: 50% 50%;
      animation: rot-hour 43200s linear infinite;
      will-change: transform;
    }
    /* Minute hand */
    .hand-min {
      transform-origin: 50% 50%;
      animation: rot-min 3600s linear infinite;
      will-change: transform;
    }
    /* Second hand — orange, fast */
    .hand-sec {
      transform-origin: 50% 50%;
      animation: rot-sec 60s linear infinite;
      will-change: transform;
    }
    /* "Ticking" second hand variant — snap each second */
    .hand-sec-tick {
      transform-origin: 50% 50%;
      animation: rot-sec-tick 60s steps(60,end) infinite;
      will-change: transform;
    }

    @keyframes rot-hour {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes rot-min {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes rot-sec {
      from { transform: rotate(-6deg); }
      to   { transform: rotate(354deg); }
    }
    @keyframes rot-sec-tick {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ── Labels ── */
    .clock-label {
      position: relative;
      z-index: 2;
      margin-top: 2rem;
      text-align: center;
      opacity: 0;
      transform: translateY(10px);
      animation: label-up 0.6s cubic-bezier(0.32,0.72,0,1) 0.9s forwards;
    }
    @keyframes label-up {
      to { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .eyebrow-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #fd8c1b;
      animation: dot-pulse 1.8s cubic-bezier(0.4,0,0.6,1) infinite;
    }
    @keyframes dot-pulse {
      0%,100% { opacity: 0.3; transform: scale(0.75); }
      50%      { opacity: 1;   transform: scale(1.25); }
    }

    .brand-line {
      margin-top: 0.5rem;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #cbd5e1;
    }

    /* ── Ambient halo behind clock ── */
    .halo {
      position: absolute;
      width: 16rem;
      height: 16rem;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(253,140,27,0.04) 0%, transparent 70%);
      pointer-events: none;
      opacity: 0;
      animation: halo-in 1.2s cubic-bezier(0.32,0.72,0,1) 0.5s forwards;
    }
    @keyframes halo-in { to { opacity: 1; } }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage" role="status" aria-live="polite" aria-label="Connecting to Bulletin Dells · Conectando con Bulletin Dells">

    <!-- Ambient halo -->
    <div class="halo" aria-hidden="true"></div>

    <!-- Clock — Double Bezel -->
    <div class="clock-shell" aria-hidden="true">
      <div class="bezel-outer">
        <div class="bezel-inner">
          <svg class="clock-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Clock face ring -->
            <circle cx="50" cy="50" r="47" fill="none" stroke="#e2e8f0" stroke-width="0.75"/>

            <!-- Hour tick marks — 12 marks -->
            <g stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round">
              <line x1="50" y1="6"  x2="50" y2="12" transform="rotate(0   50 50)"/>
              <line x1="50" y1="6"  x2="50" y2="12" transform="rotate(30  50 50)"/>
              <line x1="50" y1="6"  x2="50" y2="12" transform="rotate(60  50 50)"/>
              <line x1="50" y1="6"  x2="50" y2="12" transform="rotate(90  50 50)"/>
              <line x1="50" y1="6"  x2="50" y2="12" transform="rotate(120 50 50)"/>
              <line x1="50" y1="6"  x2="50" y2="12" transform="rotate(150 50 50)"/>
              <line x1="50" y1="6"  x2="50" y2="12" transform="rotate(180 50 50)"/>
              <line x1="50" y1="6"  x2="50" y2="12" transform="rotate(210 50 50)"/>
              <line x1="50" y1="6"  x2="50" y2="12" transform="rotate(240 50 50)"/>
              <line x1="50" y1="6"  x2="50" y2="12" transform="rotate(270 50 50)"/>
              <line x1="50" y1="6"  x2="50" y2="12" transform="rotate(300 50 50)"/>
              <line x1="50" y1="6"  x2="50" y2="12" transform="rotate(330 50 50)"/>
            </g>

            <!-- Minute marks — 60 marks (very thin) -->
            <g stroke="#f1f5f9" stroke-width="0.5" stroke-linecap="round">
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(6   50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(12  50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(18  50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(24  50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(36  50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(42  50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(48  50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(54  50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(66  50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(72  50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(78  50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(84  50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(96  50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(102 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(108 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(114 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(126 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(132 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(138 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(144 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(156 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(162 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(168 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(174 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(186 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(192 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(198 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(204 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(216 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(222 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(228 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(234 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(246 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(252 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(258 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(264 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(276 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(282 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(288 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(294 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(306 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(312 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(318 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(324 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(336 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(342 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(348 50 50)"/>
              <line x1="50" y1="5" x2="50" y2="8" transform="rotate(354 50 50)"/>
            </g>

            <!-- Hour hand — thick, slate -->
            <g class="hand-hour">
              <line x1="50" y1="50" x2="50" y2="24" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round"/>
            </g>

            <!-- Minute hand — medium, slate-600 -->
            <g class="hand-min">
              <line x1="50" y1="50" x2="50" y2="16" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
            </g>

            <!-- Second hand — orange, thin with tail -->
            <g class="hand-sec">
              <line x1="50" y1="58" x2="50" y2="14" stroke="#fd8c1b" stroke-width="0.9" stroke-linecap="round"/>
            </g>

            <!-- Center jewel -->
            <circle cx="50" cy="50" r="2.5" fill="#fd8c1b"/>
            <circle cx="50" cy="50" r="1.2" fill="white"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Label -->
    <div class="clock-label">
      <p class="eyebrow">
        Connecting
        <span class="eyebrow-dot"></span>
        Conectando
      </p>
      <p class="brand-line" style="margin-top:0.6rem;">Bulletin Dells · Wisconsin</p>
    </div>

  </div>
</body>
</html>
