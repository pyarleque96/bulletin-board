<!--
  SCREEN: 14 — Book Flip / Directory Pages
  SPEC: Fullscreen, light theme, white bg
  CUANDO: Carga del directorio principal / Yellow Pages homenaje
  CONCEPTO: Páginas de un directorio/libro (Yellow Pages homenaje) pasando
            con flip 3D en CSS (perspective + rotateY).
            Cada página tiene líneas de listado simuladas.
            Eyebrow "From pages to pixels · Del papel al pixel"
            Sensación: herencia de Yellow Pages, modernizado.
  HIGH-END: perspective: 800px en el contenedor, backface-visibility: hidden
            en cada página. Z-Axis Cascade vibe.
            Sombra tintada al color del fondo (no negra).
  BLAZOR HOOK: Usar como splash de la primera vez que el usuario abre el directorio.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulletin Dells — Loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── ANTI-FOUC ── */
    html { background: #ffffff; }
    body {
      opacity: 0;
      animation: body-fade-in 0.45s cubic-bezier(0.32,0.72,0,1) 0.08s forwards;
    }
    @keyframes body-fade-in { to { opacity: 1; } }

    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      overflow: hidden;
    }

    /* ── Main intro ── */
    .book-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      opacity: 0;
      transform: translateY(12px);
      animation: wrap-in 0.8s cubic-bezier(0.32,0.72,0,1) 0.25s forwards;
    }
    @keyframes wrap-in { to { opacity: 1; transform: translateY(0); } }

    /* ── Book container ── */
    .book-container {
      width: 13rem;
      height: 9rem;
      perspective: 800px;
      position: relative;
    }

    /* Book spine shadow */
    .book-spine {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 4px;
      margin-left: -2px;
      background: linear-gradient(to right, #cbd5e1, #e2e8f0, #cbd5e1);
      z-index: 10;
      border-radius: 2px;
      box-shadow: 0 2px 8px -2px rgba(30,41,59,0.12);
    }

    /* Each page */
    .page {
      position: absolute;
      width: 50%;
      height: 100%;
      top: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      background: #fffef8;
      border-radius: 0 6px 6px 0;
      overflow: hidden;
      box-shadow: 2px 0 8px -4px rgba(30,41,59,0.08);
    }
    .page-left {
      left: 0;
      transform-origin: right center;
    }

    /* Page content — fake listing lines */
    .page-content {
      padding: 0.7rem 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    /* Fake lines */
    .line {
      height: 0.45rem;
      border-radius: 2px;
      background: #e2e8f0;
    }
    .line.bold { background: #cbd5e1; height: 0.55rem; }
    .line.orange { background: #fde8c8; width: 45%; }
    .line.s { width: 60%; }
    .line.m { width: 80%; }
    .line.l { width: 95%; }

    /* Category label at top of page */
    .page-cat {
      font-family: 'Outfit', sans-serif;
      font-size: 5px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    /* Page number at bottom */
    .page-num {
      position: absolute;
      bottom: 6px;
      right: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 5px;
      color: #cbd5e1;
      font-weight: 500;
    }
    .page-left .page-num {
      right: auto;
      left: 8px;
    }

    /* ── Page flip animation ── */
    /* Page flips from right side → left */
    .page.flip-page {
      left: 50%;
      transform-origin: left center;
      z-index: 5;
    }

    .page.flip-page.active {
      animation: page-flip 0.65s cubic-bezier(0.4,0,0.2,1) forwards;
    }

    @keyframes page-flip {
      0%   { transform: rotateY(0deg);    box-shadow:  2px 0 8px -4px rgba(30,41,59,0.08); }
      40%  { transform: rotateY(-90deg);  box-shadow: -8px 0 20px -6px rgba(30,41,59,0.15); }
      100% { transform: rotateY(-180deg); box-shadow:  0px 0 0px 0 transparent; }
    }

    /* Pages stack effect */
    .pages-stack {
      position: absolute;
      inset: 0;
      border-radius: 0 6px 6px 0;
    }
    .stack-page {
      position: absolute;
      inset: 0;
      background: #fffef8;
      border-radius: 0 6px 6px 0;
      transform-origin: left center;
    }
    .stack-page:nth-child(1) { background: #fffef8; }
    .stack-page:nth-child(2) { background: #fffdf5; transform: rotateY(-2deg); }
    .stack-page:nth-child(3) { background: #fffdee; transform: rotateY(-4deg); }

    /* Yellow tint for pages — directory feel */
    .page, .stack-page {
      background: #fffef5;
    }

    /* ── Labels ── */
    .book-labels {
      text-align: center;
      opacity: 0;
      transform: translateY(6px);
      animation: lab-in 0.5s cubic-bezier(0.32,0.72,0,1) 0.8s forwards;
    }
    @keyframes lab-in { to { opacity: 1; transform: translateY(0); } }

    .eyebrow {
      font-family: 'Outfit', sans-serif;
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #64748b;
    }

    .sub {
      margin-top: 0.4rem;
      font-family: 'Outfit', sans-serif;
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #cbd5e1;
    }

    /* Page counter */
    .page-counter {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.75rem;
      font-family: 'Outfit', sans-serif;
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #c2650a;
      background: #fef3e2;
      border: 1px solid #fde8c8;
      border-radius: 9999px;
      padding: 0.2rem 0.65rem;
    }

    /* ── Halo ── */
    .halo {
      position: absolute;
      width: 20rem;
      height: 14rem;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(253,140,27,0.03) 0%, transparent 70%);
      pointer-events: none;
      opacity: 0;
      animation: halo-in 1.4s cubic-bezier(0.32,0.72,0,1) 0.4s forwards;
    }
    @keyframes halo-in { to { opacity: 1; } }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage" role="status" aria-live="polite" aria-label="Loading directory · Cargando directorio">

    <!-- Halo -->
    <div class="halo" aria-hidden="true"></div>

    <div class="book-wrap">

      <!-- Book -->
      <div class="book-container" aria-hidden="true">

        <!-- Spine -->
        <div class="book-spine"></div>

        <!-- Left page (static) -->
        <div class="page page-left" style="left:0; transform-origin:right center;">
          <div class="page-content">
            <p class="page-cat">Housing</p>
            <div class="line bold m"></div>
            <div class="line s"></div>
            <div class="line l"></div>
            <div class="line orange"></div>
            <div class="line m"></div>
            <div class="line s"></div>
            <div class="line bold l"></div>
            <div class="line m"></div>
            <div class="line s"></div>
          </div>
          <div class="page-num">42</div>
        </div>

        <!-- Right pages stack (depth) -->
        <div class="pages-stack" style="left:50%;">
          <div class="stack-page"></div>
          <div class="stack-page"></div>
          <div class="stack-page"></div>
        </div>

        <!-- Flipping pages — added by JS -->
        <div id="flipContainer" style="position:absolute;left:50%;top:0;width:50%;height:100%;perspective:800px;transform-style:preserve-3d;"></div>

      </div>

      <!-- Labels -->
      <div class="book-labels">
        <p class="eyebrow">From pages to pixels · Del papel al pixel</p>
        <div class="page-counter">
          <span id="pageCounter">Page 42 of 312</span>
        </div>
        <p class="sub">Bulletin Dells · Local Directory</p>
      </div>

    </div>

  </div>

  <script>
    /* BLAZOR HOOK: Replace page categories with actual category data */
    /* Bind page count to total listing count */

    const categories = [
      { name: 'Housing', nameEs: 'Vivienda', page: 42 },
      { name: 'Transport', nameEs: 'Transporte', page: 87 },
      { name: 'Jobs', nameEs: 'Empleos', page: 124 },
      { name: 'Beauty', nameEs: 'Belleza', page: 156 },
      { name: 'Car Rentals', nameEs: 'Autos', page: 198 },
      { name: 'Rides', nameEs: 'Rides', page: 237 },
      { name: 'Mechanics', nameEs: 'Mecánicos', page: 271 },
      { name: 'Providers', nameEs: 'Proveedores', page: 312 }
    ];

    const container = document.getElementById('flipContainer');
    const pageCounter = document.getElementById('pageCounter');
    let catIndex = 0;

    function makePage(cat) {
      const page = document.createElement('div');
      page.style.cssText = `
        position: absolute; inset: 0;
        background: #fffef5;
        border-radius: 0 6px 6px 0;
        transform-origin: left center;
        transform: rotateY(0deg);
        backface-visibility: hidden;
        box-shadow: 2px 0 8px -4px rgba(30,41,59,0.08);
        overflow: hidden;
        transition: transform 0.65s cubic-bezier(0.4,0,0.2,1),
                    box-shadow 0.65s cubic-bezier(0.4,0,0.2,1);
      `;
      page.innerHTML = `
        <div style="padding:0.7rem 0.6rem; display:flex; flex-direction:column; gap:0.3rem;">
          <p style="font-family:Outfit,sans-serif;font-size:5px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#fd8c1b;margin-bottom:4px;">${cat.name} · ${cat.nameEs}</p>
          <div style="height:0.55rem;border-radius:2px;background:#cbd5e1;width:90%;"></div>
          <div style="height:0.45rem;border-radius:2px;background:#e2e8f0;width:70%;"></div>
          <div style="height:0.45rem;border-radius:2px;background:#e2e8f0;width:85%;"></div>
          <div style="height:0.45rem;border-radius:2px;background:#fde8c8;width:50%;"></div>
          <div style="height:0.45rem;border-radius:2px;background:#e2e8f0;width:75%;"></div>
          <div style="height:0.45rem;border-radius:2px;background:#e2e8f0;width:60%;"></div>
          <div style="height:0.55rem;border-radius:2px;background:#cbd5e1;width:95%;"></div>
          <div style="height:0.45rem;border-radius:2px;background:#e2e8f0;width:80%;"></div>
        </div>
        <span style="position:absolute;bottom:6px;right:8px;font-family:Outfit,sans-serif;font-size:5px;color:#cbd5e1;font-weight:500;">${cat.page}</span>
      `;
      return page;
    }

    function flipNext() {
      if (catIndex >= categories.length) return;
      const cat = categories[catIndex];
      catIndex++;

      const page = makePage(cat);
      container.appendChild(page);

      // Animate after brief render pause
      setTimeout(() => {
        page.style.transform = 'rotateY(-180deg)';
        page.style.boxShadow = '0 0 0 transparent';
        pageCounter.textContent = `Page ${cat.page} of 312`;
      }, 50);

      // Remove old pages to keep DOM clean
      setTimeout(() => {
        if (container.children.length > 3) {
          container.removeChild(container.firstChild);
        }
        flipNext();
      }, 780);
    }

    // Start flipping after intro
    setTimeout(flipNext, 700);
  </script>
</body>
</html>
