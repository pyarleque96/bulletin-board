<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skeleton — Listing Card Component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', system-ui, sans-serif; background: #F8FAFC; padding: 40px 24px; }

    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .sk {
      background: linear-gradient(90deg, #E2E8F0 25%, #F1F5F9 50%, #E2E8F0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.8s ease-in-out infinite;
      border-radius: 6px;
    }

    /* Card-level stagger via CSS custom property */
    .card-1 .sk { animation-delay: 0s; }
    .card-2 .sk { animation-delay: 0.15s; }
    .card-3 .sk { animation-delay: 0.3s; }

    /* Double-bezel card shell */
    .listing-card-shell {
      padding: 8px;
      background: rgba(255,255,255,0.9);
      border-radius: 1.75rem;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.05);
    }

    .listing-card-core {
      background: white;
      border-radius: calc(1.75rem - 6px);
      overflow: hidden;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.8);
    }

    /* Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    @media (min-width: 640px) {
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 900px) {
      .cards-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body aria-busy="true">

<!-- Page label -->
<div style="max-width:1100px; margin:0 auto 32px;">
  <p style="font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:#94A3B8;">
    Listing Card — Skeleton Component
  </p>
</div>

<!-- 3 Cards Grid -->
<div class="cards-grid">

  <!-- CARD 1 -->
  <article class="listing-card-shell card-1" aria-busy="true" aria-label="Loading listing">
    <div class="listing-card-core">
      <!-- Image (16:9) -->
      <div class="sk" style="width:100%; aspect-ratio:16/9; border-radius:0;"></div>

      <!-- Body -->
      <div style="padding:18px 20px 20px;">
        <!-- Tier badge -->
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
          <div class="sk" style="width:52px; height:20px; border-radius:999px;"></div>
          <div class="sk" style="width:36px; height:20px; border-radius:999px;"></div>
        </div>

        <!-- Title lines -->
        <div class="sk" style="height:17px; width:88%; margin-bottom:8px;"></div>
        <div class="sk" style="height:17px; width:72%; margin-bottom:14px;"></div>

        <!-- Description lines -->
        <div class="sk" style="height:12px; width:100%; margin-bottom:6px;"></div>
        <div class="sk" style="height:12px; width:94%; margin-bottom:6px;"></div>
        <div class="sk" style="height:12px; width:80%; margin-bottom:16px;"></div>

        <!-- Rating stars -->
        <div style="display:flex; gap:4px; align-items:center; margin-bottom:16px;">
          <div class="sk" style="width:14px; height:14px; border-radius:3px;"></div>
          <div class="sk" style="width:14px; height:14px; border-radius:3px;"></div>
          <div class="sk" style="width:14px; height:14px; border-radius:3px;"></div>
          <div class="sk" style="width:14px; height:14px; border-radius:3px;"></div>
          <div class="sk" style="width:14px; height:14px; border-radius:3px;"></div>
          <div class="sk" style="width:28px; height:12px; margin-left:4px;"></div>
        </div>

        <!-- CTA button -->
        <div class="sk" style="width:100%; height:42px; border-radius:999px;"></div>
      </div>
    </div>
  </article>

  <!-- CARD 2 -->
  <article class="listing-card-shell card-2" aria-busy="true" aria-label="Loading listing">
    <div class="listing-card-core">
      <div class="sk" style="width:100%; aspect-ratio:16/9; border-radius:0;"></div>
      <div style="padding:18px 20px 20px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
          <div class="sk" style="width:40px; height:20px; border-radius:999px;"></div>
        </div>
        <div class="sk" style="height:17px; width:92%; margin-bottom:8px;"></div>
        <div class="sk" style="height:17px; width:68%; margin-bottom:14px;"></div>
        <div class="sk" style="height:12px; width:100%; margin-bottom:6px;"></div>
        <div class="sk" style="height:12px; width:90%; margin-bottom:6px;"></div>
        <div class="sk" style="height:12px; width:76%; margin-bottom:16px;"></div>
        <div style="display:flex; gap:4px; align-items:center; margin-bottom:16px;">
          <div class="sk" style="width:14px; height:14px; border-radius:3px;"></div>
          <div class="sk" style="width:14px; height:14px; border-radius:3px;"></div>
          <div class="sk" style="width:14px; height:14px; border-radius:3px;"></div>
          <div class="sk" style="width:14px; height:14px; border-radius:3px;"></div>
          <div class="sk" style="width:14px; height:14px; border-radius:3px;"></div>
          <div class="sk" style="width:28px; height:12px; margin-left:4px;"></div>
        </div>
        <div class="sk" style="width:100%; height:42px; border-radius:999px;"></div>
      </div>
    </div>
  </article>

  <!-- CARD 3 -->
  <article class="listing-card-shell card-3" aria-busy="true" aria-label="Loading listing">
    <div class="listing-card-core">
      <div class="sk" style="width:100%; aspect-ratio:16/9; border-radius:0;"></div>
      <div style="padding:18px 20px 20px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
          <div class="sk" style="width:64px; height:20px; border-radius:999px;"></div>
          <div class="sk" style="width:44px; height:20px; border-radius:999px;"></div>
        </div>
        <div class="sk" style="height:17px; width:80%; margin-bottom:8px;"></div>
        <div class="sk" style="height:17px; width:60%; margin-bottom:14px;"></div>
        <div class="sk" style="height:12px; width:100%; margin-bottom:6px;"></div>
        <div class="sk" style="height:12px; width:86%; margin-bottom:6px;"></div>
        <div class="sk" style="height:12px; width:70%; margin-bottom:16px;"></div>
        <div style="display:flex; gap:4px; align-items:center; margin-bottom:16px;">
          <div class="sk" style="width:14px; height:14px; border-radius:3px;"></div>
          <div class="sk" style="width:14px; height:14px; border-radius:3px;"></div>
          <div class="sk" style="width:14px; height:14px; border-radius:3px;"></div>
          <div class="sk" style="width:14px; height:14px; border-radius:3px;"></div>
          <div class="sk" style="width:14px; height:14px; border-radius:3px;"></div>
          <div class="sk" style="width:28px; height:12px; margin-left:4px;"></div>
        </div>
        <div class="sk" style="width:100%; height:42px; border-radius:999px;"></div>
      </div>
    </div>
  </article>

</div>

<div role="status" class="sr-only" aria-live="polite">
  Loading listings — Cargando anuncios
</div>

</body>
</html>
