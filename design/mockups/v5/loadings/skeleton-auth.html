<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skeleton — Auth Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #F8FAFC;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Subtle dot grid bg */
    body {
      background-image: radial-gradient(circle, #CBD5E1 1px, transparent 1px);
      background-size: 28px 28px;
      background-color: #F8FAFC;
    }

    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .sk {
      background: linear-gradient(90deg, #E2E8F0 25%, #F1F5F9 50%, #E2E8F0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.8s ease-in-out infinite;
      border-radius: 6px;
    }

    .sk-d1 { animation-delay: 0s; }
    .sk-d2 { animation-delay: 0.1s; }
    .sk-d3 { animation-delay: 0.2s; }
    .sk-d4 { animation-delay: 0.3s; }
    .sk-d5 { animation-delay: 0.4s; }
    .sk-d6 { animation-delay: 0.5s; }

    /* Double-bezel card */
    .auth-card-shell {
      width: 100%;
      max-width: 420px;
      padding: 10px;
      background: rgba(255,255,255,0.85);
      border-radius: 2rem;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.05), 0 16px 40px rgba(59,130,246,0.06);
      backdrop-filter: blur(8px);
    }

    .auth-card-core {
      background: white;
      border-radius: calc(2rem - 8px);
      padding: 36px 32px 40px;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.9);
    }

    /* Divider line */
    .divider {
      height: 1px;
      background: #F1F5F9;
      margin: 20px 0;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body aria-busy="true">

<div class="auth-card-shell" role="status" aria-label="Loading authentication form — Cargando formulario">
  <div class="auth-card-core">

    <!-- Logo centered -->
    <div style="display:flex; flex-direction:column; align-items:center; margin-bottom:28px;">
      <!-- Icon mark -->
      <div class="sk sk-d1" style="width:52px; height:52px; border-radius:14px; margin-bottom:14px;"></div>
      <!-- Wordmark -->
      <div class="sk sk-d2" style="width:140px; height:22px; border-radius:6px;"></div>
    </div>

    <!-- Title -->
    <div style="margin-bottom:6px;">
      <div class="sk sk-d2" style="width:65%; height:26px; border-radius:8px; margin:0 auto;"></div>
    </div>
    <!-- Subtitle -->
    <div style="margin-bottom:28px;">
      <div class="sk sk-d3" style="width:80%; height:13px; border-radius:6px; margin:8px auto 0;"></div>
    </div>

    <!-- Social auth button (optional) -->
    <div class="sk sk-d3" style="height:44px; border-radius:999px; margin-bottom:16px;"></div>

    <!-- Divider with OR -->
    <div class="divider"></div>

    <!-- Input 1: Email -->
    <div style="margin-bottom:16px;">
      <div class="sk sk-d4" style="width:60px; height:12px; margin-bottom:7px;"></div>
      <div class="sk sk-d4" style="height:44px; border-radius:10px;"></div>
    </div>

    <!-- Input 2: Password -->
    <div style="margin-bottom:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:7px;">
        <div class="sk sk-d5" style="width:70px; height:12px;"></div>
        <div class="sk sk-d5" style="width:80px; height:11px;"></div>
      </div>
      <div class="sk sk-d5" style="height:44px; border-radius:10px;"></div>
    </div>

    <!-- Input 3: Confirm / Phone -->
    <div style="margin-bottom:24px;">
      <div class="sk sk-d6" style="width:120px; height:12px; margin-bottom:7px;"></div>
      <div class="sk sk-d6" style="height:44px; border-radius:10px;"></div>
    </div>

    <!-- Submit button -->
    <div class="sk sk-d6" style="height:48px; border-radius:999px; margin-bottom:16px;"></div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Footer link: "Already have an account?" -->
    <div style="text-align:center;">
      <div class="sk sk-d6" style="width:72%; height:12px; border-radius:6px; margin:0 auto;"></div>
    </div>

    <!-- Language toggle hint -->
    <div style="text-align:center; margin-top:12px;">
      <div class="sk sk-d6" style="width:40%; height:11px; border-radius:999px; margin:0 auto;"></div>
    </div>

  </div>
</div>

<div role="status" class="sr-only" aria-live="polite">
  Loading form — Cargando formulario de acceso
</div>

</body>
</html>
