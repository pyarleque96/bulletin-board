<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulletin Dells — Gradient Sweep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /*
    =====================================================================
    SCREEN: 16-gradient-sweep.html
    SPEC:   Barra horizontal ancha con sweep de gradiente naranja que
            cruza de izquierda a derecha sobre un track slate muy suave.
            La barra es larga (80 % del ancho max 480px), altura 6px con
            border-radius total. El sweep es un highlight blanco/naranja
            que pasa sobre ella en bucle. Debajo, el texto de estado.
            Versión premium del clásico indeterminate progress bar.
    CUÁNDO: Carga de imágenes del listing / upload de fotos del proveedor /
            cualquier operación de archivo en curso.
    BLAZOR HOOK: Agregar atributo data-value="X" para convertir a barra
                 de progreso determinada. JS en la página lee ese atributo
                 y actualiza el clip-path del fill. O reemplazar la animación
                 infinita con una transición de width controlada por Blazor.
    =====================================================================
    */

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #fff; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #ffffff;
      min-height: 100dvh;
      overflow: hidden;
      opacity: 0;
      animation: body-fade-in 0.45s ease-out 0.08s forwards;
    }
    @keyframes body-fade-in { to { opacity: 1; } }

    .stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      pointer-events: none;
      padding: 0 32px;
    }

    /* Ícono de Bulletin Dells simplificado */
    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #fd8c1b;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: icon-in 0.5s ease-out 0.2s forwards;
    }
    @keyframes icon-in {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }
    .brand-letter {
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      line-height: 1;
    }

    /* Barra de progreso */
    .bar-wrap {
      width: 100%;
      max-width: 400px;
      opacity: 0;
      animation: bar-in 0.5s ease-out 0.3s forwards;
    }
    @keyframes bar-in {
      from { opacity: 0; transform: scaleX(0.85); }
      to   { opacity: 1; transform: scaleX(1); }
    }

    .bar-track {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: #f1f5f9;
      position: relative;
      overflow: hidden;
    }

    /* Fill naranja que va de 0 a ~65% (indeterminate) */
    .bar-fill {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #fd8c1b 0%, #fb923c 100%);
      transform: translateX(-100%);
      animation: bar-slide 2s cubic-bezier(0.4, 0, 0.2, 1) 0.5s infinite;
    }
    @keyframes bar-slide {
      0%   { transform: translateX(-100%) scaleX(0.3); }
      40%  { transform: translateX(0%)    scaleX(0.7); }
      60%  { transform: translateX(30%)   scaleX(0.6); }
      100% { transform: translateX(150%)  scaleX(0.3); }
    }

    /* Sweep / shimmer sobre el fill */
    .bar-shimmer {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,255,255,0.55) 50%,
        transparent 100%
      );
      background-size: 200% 100%;
      animation: shimmer-move 1.6s linear 0.8s infinite;
    }
    @keyframes shimmer-move {
      from { background-position: -200% 0; }
      to   { background-position:  200% 0; }
    }

    /* Texto */
    .label {
      text-align: center;
      opacity: 0;
      animation: bar-in 0.5s ease-out 0.5s forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      body { animation: none; opacity: 1; }
      .brand-icon, .bar-wrap, .label { animation: none; opacity: 1; }
      .bar-fill { animation: none; transform: translateX(0); width: 60%; }
      .bar-shimmer { animation: none; }
    }
  </style>
</head>
<body>

  <div
    class="stage"
    role="status"
    aria-live="polite"
    aria-label="Loading Bulletin Dells · Cargando Bulletin Dells"
  >
    <div class="brand-icon">
      <span class="brand-letter">B</span>
    </div>

    <div class="bar-wrap">
      <div class="bar-track" aria-hidden="true">
        <div class="bar-fill"></div>
        <div class="bar-shimmer"></div>
      </div>
    </div>

    <div class="label">
      <p class="text-sm font-medium text-slate-700">Loading content</p>
      <p class="text-xs text-slate-400 mt-0.5">Cargando contenido…</p>
    </div>
  </div>

</body>
</html>
