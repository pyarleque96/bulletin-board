<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulletin Dells — Square Grid Pulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /*
    =====================================================================
    SCREEN: 21-square-grid-pulse.html
    SPEC:   Grid 3x3 de cuadraditos (con border-radius suave) que hacen
            pulse en patrón diagonal: el cuadrado (0,0) empieza, luego
            (1,0) y (0,1) simultáneamente, luego (2,0), (1,1), (0,2),
            etc. — viajando del esquina superior-izquierda a inferior-
            derecha en cascada diagonal. Color alterna entre naranja
            sólido (#fd8c1b) y slate suave (#e2e8f0) en el base.
    CUÁNDO: Carga de galería de imágenes del listing / carga del panel
            GM con múltiples cards de aprobación pendientes.
    BLAZOR HOOK: Componente <GridPulseLoader /> — puro CSS, sin JS.
                 Controlar visibilidad con @if (isLoading).
    =====================================================================
    */

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #fff; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #ffffff;
      min-height: 100dvh;
      overflow: hidden;
      opacity: 0;
      animation: body-fade-in 0.45s ease-out 0.08s forwards;
    }
    @keyframes body-fade-in { to { opacity: 1; } }

    .stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      pointer-events: none;
    }

    /* Grid 3x3 */
    .grid-wrap {
      display: grid;
      grid-template-columns: repeat(3, 18px);
      grid-template-rows:    repeat(3, 18px);
      gap: 6px;
      opacity: 0;
      animation: grid-intro 0.5s ease-out 0.2s forwards;
    }
    @keyframes grid-intro {
      from { opacity: 0; transform: scale(0.7) rotate(-5deg); }
      to   { opacity: 1; transform: scale(1)   rotate(0deg); }
    }

    /* Cuadradito base */
    .sq {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: #e2e8f0;
      animation: sq-pulse 1.8s ease-in-out infinite;
    }

    @keyframes sq-pulse {
      0%, 100% { background: #e2e8f0; transform: scale(1);    opacity: 0.6; }
      50%       { background: #fd8c1b; transform: scale(1.15); opacity: 1; }
    }

    /*
      Delays para patrón diagonal (suma de coordenadas fila + col):
      (0,0)=0  → delay 0
      (0,1)=1, (1,0)=1 → delay 0.18s
      (0,2)=2, (1,1)=2, (2,0)=2 → delay 0.36s
      (1,2)=3, (2,1)=3 → delay 0.54s
      (2,2)=4 → delay 0.72s
    */
    /* Fila 0 */
    .sq:nth-child(1) { animation-delay: 0s; }       /* (0,0) diag 0 */
    .sq:nth-child(2) { animation-delay: 0.18s; }    /* (0,1) diag 1 */
    .sq:nth-child(3) { animation-delay: 0.36s; }    /* (0,2) diag 2 */
    /* Fila 1 */
    .sq:nth-child(4) { animation-delay: 0.18s; }    /* (1,0) diag 1 */
    .sq:nth-child(5) { animation-delay: 0.36s; }    /* (1,1) diag 2 */
    .sq:nth-child(6) { animation-delay: 0.54s; }    /* (1,2) diag 3 */
    /* Fila 2 */
    .sq:nth-child(7) { animation-delay: 0.36s; }    /* (2,0) diag 2 */
    .sq:nth-child(8) { animation-delay: 0.54s; }    /* (2,1) diag 3 */
    .sq:nth-child(9) { animation-delay: 0.72s; }    /* (2,2) diag 4 */

    /* Texto */
    .label {
      text-align: center;
      opacity: 0;
      animation: label-in 0.5s ease-out 0.45s forwards;
    }
    @keyframes label-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      body { animation: none; opacity: 1; }
      .grid-wrap, .label { animation: none; opacity: 1; }
      .sq { animation: none; background: #fd8c1b; opacity: 0.8; }
    }
  </style>
</head>
<body>

  <div
    class="stage"
    role="status"
    aria-live="polite"
    aria-label="Loading Bulletin Dells · Cargando Bulletin Dells"
  >
    <div class="grid-wrap" aria-hidden="true">
      <!-- 9 cuadraditos — fila × col -->
      <div class="sq"></div>
      <div class="sq"></div>
      <div class="sq"></div>
      <div class="sq"></div>
      <div class="sq"></div>
      <div class="sq"></div>
      <div class="sq"></div>
      <div class="sq"></div>
      <div class="sq"></div>
    </div>

    <div class="label">
      <p class="text-sm font-medium text-slate-700">Loading</p>
      <p class="text-xs text-slate-400 mt-0.5">Cargando…</p>
    </div>
  </div>

</body>
</html>
